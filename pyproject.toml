[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicommit"
version = "0.1.0"
description = "Write git commit messages, PR descriptions and changelogs from the diff, on free NVIDIA NIM or a local Ollama model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
keywords = [
    "git",
    "commit",
    "conventional-commits",
    "changelog",
    "cli",
    "llm",
    "nvidia-nim",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12.0",
    "click>=8.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/AleBrito124356/ai-commit"
Repository = "https://github.com/AleBrito124356/ai-commit"

[project.scripts]
aicommit = "aicommit.cli:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["aicommit"]
# Three lines that only run as `python -m aicommit` in a subprocess; covered
# behaviourally by tests/test_entrypoints.py rather than by line tracing.
omit = ["*/aicommit/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
